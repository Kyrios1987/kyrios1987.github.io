<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>墨香阁 | 个人知识库</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
        }
        
        :root {
            --primary: #4361ee;
            --primary-dark: #3a56d4;
            --secondary: #3f37c9;
            --accent: #4895ef;
            --light: #f8f9fa;
            --dark: #212529;
            --gray: #6c757d;
            --light-gray: #e9ecef;
            --border: #dee2e6;
            --card-shadow: 0 4px 12px rgba(0,0,0,0.08);
            --hover-shadow: 0 8px 20px rgba(0,0,0,0.12);
            --transition: all 0.3s ease;
            --success: #28a745;
            --info: #17a2b8;
            --warning: #ffc107;
        }
        
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #e4edf5 100%);
            color: var(--dark);
            line-height: 1.6;
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 260px 1fr;
            gap: 25px;
        }
        
        /* 头部样式 */
        header {
            grid-column: 1 / -1;
            text-align: center;
            padding: 30px 0;
            margin-bottom: 10px;
        }
        
        .logo-container {
            display: inline-block;
            margin-bottom: 20px;
            border-radius: 50%;
            padding: 10px;
            background: white;
            box-shadow: var(--card-shadow);
            transition: transform 0.5s ease, box-shadow 0.5s ease;
        }
        
        .logo-container:hover {
            transform: rotate(10deg) scale(1.05);
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
        }
        
        .logo {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid var(--light);
        }
        
        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 8px;
            color: var(--dark);
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .subtitle {
            font-size: 1.2rem;
            color: var(--gray);
            max-width: 600px;
            margin: 0 auto;
        }
        
        /* 左侧标签导航 */
        .sidebar {
            background: white;
            border-radius: 16px;
            padding: 28px 20px;
            box-shadow: var(--card-shadow);
            align-self: start;
            position: sticky;
            top: 20px;
        }
        
        .sidebar h2 {
            font-size: 1.4rem;
            margin-bottom: 22px;
            padding-bottom: 15px;
            border-bottom: 2px solid var(--light-gray);
            color: var(--dark);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .tags-container {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }
        
        .tag {
            background: var(--light);
            padding: 9px 18px;
            border-radius: 30px;
            font-size: 0.95rem;
            cursor: pointer;
            transition: var(--transition);
            border: 1px solid var(--border);
            color: var(--gray);
        }
        
        .tag:hover {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(67, 97, 238, 0.2);
        }
        
        .tag.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
            font-weight: 600;
        }
        
        /* 右侧内容区域 */
        .content {
            background: white;
            border-radius: 16px;
            padding: 35px 30px;
            box-shadow: var(--card-shadow);
            display: flex;
            flex-direction: column;
        }
        
        .content-header {
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .content-header h2 {
            font-size: 1.6rem;
            color: var(--dark);
        }
        
        .article-count {
            font-size: 0.95rem;
            color: var(--gray);
            background: var(--light-gray);
            padding: 5px 12px;
            border-radius: 20px;
        }
        
        /* 文章列表 */
        .articles-list {
            display: flex;
            flex-direction: column;
            gap: 22px;
            margin-bottom: 30px;
        }
        
        .article-item {
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 25px;
            transition: var(--transition);
            background: white;
            position: relative;
            overflow: hidden;
        }
        
        .article-item:hover {
            transform: translateY(-5px);
            box-shadow: var(--hover-shadow);
            border-color: var(--accent);
        }
        
        .article-item::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 4px;
            height: 100%;
            background: var(--primary);
            opacity: 0;
            transition: var(--transition);
        }
        
        .article-item:hover::before {
            opacity: 1;
        }
        
        .article-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        
        .article-date {
            font-size: 0.9rem;
            color: var(--gray);
            background: var(--light-gray);
            padding: 4px 12px;
            border-radius: 20px;
        }
        
        .article-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 15px;
        }
        
        .article-tag {
            font-size: 0.85rem;
            background: rgba(67, 97, 238, 0.1);
            color: var(--primary);
            padding: 4px 12px;
            border-radius: 20px;
            transition: var(--transition);
        }
        
        .article-tag:hover {
            background: rgba(67, 97, 238, 0.2);
            transform: scale(1.05);
        }
        
        .article-title {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 12px;
            color: var(--dark);
        }
        
        .article-title a {
            color: inherit;
            text-decoration: none;
            transition: var(--transition);
            display: inline-block;
        }
        
        .article-title a:hover {
            color: var(--primary);
            transform: translateX(5px);
        }
        
        .article-excerpt {
            color: var(--gray);
            margin-bottom: 20px;
            line-height: 1.7;
        }
        
        .read-more {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            transition: var(--transition);
        }
        
        .read-more:hover {
            color: var(--secondary);
            gap: 12px;
        }
        
        /* 分页控件 */
        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin-top: auto;
            padding-top: 30px;
        }
        
        .page-btn {
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: var(--light);
            color: var(--dark);
            text-decoration: none;
            font-weight: 500;
            transition: var(--transition);
            border: 1px solid var(--border);
        }
        
        .page-btn:hover {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
            transform: translateY(-2px);
        }
        
        .page-btn.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
            font-weight: 600;
        }
        
        .page-btn.disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }
        
        .page-btn.disabled:hover {
            background: var(--light);
            color: var(--dark);
            border-color: var(--border);
        }
        
        /* 信息模块容器 */
        .info-container {
            grid-column: 1 / -1;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-top: 30px;
        }
        
        .info-card {
            background: white;
            border-radius: 16px;
            padding: 25px;
            box-shadow: var(--card-shadow);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            transition: var(--transition);
            position: relative;
            overflow: hidden;
        }
        
        .info-card:hover {
            transform: translateY(-5px);
            box-shadow: var(--hover-shadow);
        }
        
        .info-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
        }
        
        .info-card:nth-child(1)::before {
            background: linear-gradient(90deg, var(--primary), var(--accent));
        }
        
        .info-card:nth-child(2)::before {
            background: linear-gradient(90deg, var(--success), var(--info));
        }
        
        .info-card:nth-child(3)::before {
            background: linear-gradient(90deg, var(--warning), #fd7e14);
        }
        
        .info-icon {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
            font-size: 28px;
            color: white;
        }
        
        .info-card:nth-child(1) .info-icon {
            background: linear-gradient(135deg, var(--primary), var(--accent));
            box-shadow: 0 6px 15px rgba(67, 97, 238, 0.3);
        }
        
        .info-card:nth-child(2) .info-icon {
            background: linear-gradient(135deg, var(--success), var(--info));
            box-shadow: 0 6px 15px rgba(40, 167, 69, 0.3);
        }
        
        .info-card:nth-child(3) .info-icon {
            background: linear-gradient(135deg, var(--warning), #fd7e14);
            box-shadow: 0 6px 15px rgba(255, 193, 7, 0.3);
        }
        
        .info-title {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 15px;
            color: var(--dark);
        }
        
        .info-content {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--dark);
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .info-content .uptime-unit {
            font-size: 0.9rem;
            font-weight: normal;
            color: var(--gray);
            margin-left: 3px;
        }
        
        .info-subtitle {
            font-size: 0.85rem;
            color: var(--gray);
            margin-top: 10px;
        }
        
        /* 页脚 */
        footer {
            grid-column: 1 / -1;
            text-align: center;
            padding: 30px 0;
            margin-top: 30px;
            border-top: 1px solid var(--border);
            color: var(--gray);
            font-size: 0.95rem;
        }
        
        /* 响应式设计 */
        @media (max-width: 900px) {
            .container {
                grid-template-columns: 1fr;
            }
            
            .sidebar {
                position: static;
            }
            
            .tags-container {
                justify-content: center;
            }
            
            .info-container {
                grid-template-columns: 1fr;
            }
        }
        
        @media (max-width: 600px) {
            header {
                padding: 20px 0;
            }
            
            .logo {
                width: 80px;
                height: 80px;
            }
            
            h1 {
                font-size: 2rem;
            }
            
            .content {
                padding: 20px 15px;
            }
            
            .article-item {
                padding: 18px;
            }
            
            .article-title {
                font-size: 1.3rem;
            }
            
            .pagination {
                flex-wrap: wrap;
            }
            
            .info-card {
                padding: 20px 15px;
            }
            
            .info-content {
                font-size: 1.1rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="logo-container">
                <img src="pic/logo.png" alt="墨香阁 Logo" class="logo">
            </div>
            <h1>墨香阁</h1>
            <p class="subtitle">记录技术思考与生活感悟</p>
        </header>
        
        <!-- 左侧标签导航 -->
        <aside class="sidebar">
            <h2><i class="fas fa-tags"></i> 文章分类</h2>
            <div class="tags-container">
                <div class="tag active" data-tag="all">全部文章</div>
                <div class="tag" data-tag="前端">前端开发</div>
                <div class="tag" data-tag="后端">后端技术</div>
                <div class="tag" data-tag="生活">生活随笔</div>
                <div class="tag" data-tag="算法">算法学习</div>
                <div class="tag" data-tag="工具">效率工具</div>
                <div class="tag" data-tag="读书">读书笔记</div>
            </div>
        </aside>
        
        <!-- 右侧内容区域 -->
        <main class="content">
            <div class="content-header">
                <h2>最新文章</h2>
                <div class="article-count">共 <span id="article-count">12</span> 篇文章</div>
            </div>
            
            <div class="articles-list" id="articles-container">
                <!-- 文章列表将通过JavaScript动态生成 -->
            </div>
            
            <!-- 分页控件 -->
            <div class="pagination" id="pagination">
                <!-- 分页按钮将通过JavaScript动态生成 -->
            </div>
        </main>
        
        <!-- 信息模块 -->
        <div class="info-container">
            <div class="info-card">
                <div class="info-icon">
                    <i class="fas fa-clock"></i>
                </div>
                <div class="info-title">当前时间</div>
                <div class="info-content" id="current-time">
                    2025-08-04 10:30:45
                </div>
                <div class="info-subtitle">北京时间 (UTC+8)</div>
            </div>
            
            <div class="info-card">
                <div class="info-icon">
                    <i class="fas fa-map-marker-alt"></i>
                </div>
                <div class="info-title">访问者IP</div>
                <div class="info-content" id="visitor-ip">
                    获取中...
                </div>
                <div class="info-subtitle">您的网络位置信息</div>
            </div>
            
            <div class="info-card">
                <div class="info-icon">
                    <i class="fas fa-server"></i>
                </div>
                <div class="info-title">网站运行时间</div>
                <div class="info-content" id="uptime">
                    <span id="uptime-days">3</span><span class="uptime-unit">天</span>
                    <span id="uptime-hours">0</span><span class="uptime-unit">时</span>
                    <span id="uptime-minutes">0</span><span class="uptime-unit">分</span>
                    <span id="uptime-seconds">0</span><span class="uptime-unit">秒</span>
                </div>
                <div class="info-subtitle">上线日期: 2025-08-01 10:00</div>
            </div>
        </div>
        
        <footer>
            <p>© 2023-2025 墨香阁 | 简约而不简单的个人博客</p>
            <p>使用纯HTML/CSS/JS构建 | 已隐藏文章ID | 分页功能</p>
        </footer>
    </div>
    
    <script>
        // 文章数据
        const articles = [
            { id: "00001", title: "深入理解CSS Flexbox布局", excerpt: "本文详细解析Flexbox布局的核心概念和实际应用，帮助你彻底掌握这一强大的CSS布局方案。", date: "2023-08-15", tags: ["前端", "CSS"] },
            { id: "00002", title: "Node.js异步编程最佳实践", excerpt: "探索Node.js中异步编程的各种模式，从回调到Promise再到Async/Await，分析各自的优缺点和适用场景。", date: "2023-08-10", tags: ["后端", "Node.js"] },
            { id: "00003", title: "我的效率工具清单", excerpt: "分享我在日常工作中使用的高效工具，涵盖开发、写作、时间管理等各个方面，提升你的工作效率。", date: "2023-08-05", tags: ["工具", "生活"] },
            { id: "00004", title: "Vue3组合式API实践指南", excerpt: "通过实际项目案例，展示Vue3组合式API的优势和使用技巧，帮助你构建更可维护的前端应用。", date: "2023-07-28", tags: ["前端", "Vue"] },
            { id: "00005", title: "数据结构与算法学习路径", excerpt: "针对前端工程师的数据结构与算法学习指南，精选最实用的知识点和最佳学习资源。", date: "2023-07-20", tags: ["算法", "前端"] },
            { id: "00006", title: "《深入浅出设计模式》读书笔记", excerpt: "记录阅读经典书籍《深入浅出设计模式》的收获和思考，总结常见设计模式的应用场景。", date: "2023-07-12", tags: ["读书", "后端"] },
            { id: "00007", title: "TypeScript高级类型技巧", excerpt: "深入探讨TypeScript中的高级类型特性，包括条件类型、映射类型和类型推断等实用技巧。", date: "2023-07-05", tags: ["前端", "TypeScript"] },
            { id: "00008", title: "Docker容器化实践指南", excerpt: "从基础概念到实际部署，全面介绍Docker容器化技术及其在现代开发中的应用实践。", date: "2023-06-28", tags: ["后端", "DevOps"] },
            { id: "00009", title: "现代响应式设计原则", excerpt: "探索2023年最新的响应式设计原则和技术，创建在各种设备上都能完美呈现的网站体验。", date: "2023-06-20", tags: ["前端", "设计"] },
            { id: "00010", title: "Python数据处理技巧", excerpt: "分享使用Python进行数据清洗、分析和可视化的实用技巧，提高你的数据处理效率。", date: "2023-06-15", tags: ["后端", "Python"] },
            { id: "00011", title: "高效学习编程的方法", excerpt: "经过验证的高效学习编程的策略和方法，帮助初学者更快地掌握编程技能。", date: "2023-06-08", tags: ["学习", "编程"] },
            { id: "00012", title: "Git高级使用技巧", excerpt: "超越基础命令，掌握Git的高级功能和技巧，提升你的版本控制能力和团队协作效率。", date: "2023-06-01", tags: ["工具", "后端"] }
        ];
        
        // 分页配置
        const articlesPerPage = 6;
        let currentPage = 1;
        let currentTag = 'all';
        
        // DOM元素
        const articlesContainer = document.getElementById('articles-container');
        const paginationContainer = document.getElementById('pagination');
        const articleCountElement = document.getElementById('article-count');
        const tags = document.querySelectorAll('.tag');
        
        // 信息模块DOM
        const currentTimeElement = document.getElementById('current-time');
        const visitorIpElement = document.getElementById('visitor-ip');
        const uptimeDaysElement = document.getElementById('uptime-days');
        const uptimeHoursElement = document.getElementById('uptime-hours');
        const uptimeMinutesElement = document.getElementById('uptime-minutes');
        const uptimeSecondsElement = document.getElementById('uptime-seconds');
        
        // 渲染文章列表
        function renderArticles() {
            // 筛选文章
            let filteredArticles = currentTag === 'all' 
                ? [...articles] 
                : articles.filter(article => article.tags.includes(currentTag));
            
            // 更新文章计数
            articleCountElement.textContent = filteredArticles.length;
            
            // 计算分页
            const totalPages = Math.ceil(filteredArticles.length / articlesPerPage);
            const startIndex = (currentPage - 1) * articlesPerPage;
            const endIndex = Math.min(startIndex + articlesPerPage, filteredArticles.length);
            const currentArticles = filteredArticles.slice(startIndex, endIndex);
            
            // 渲染文章
            articlesContainer.innerHTML = '';
            
            currentArticles.forEach(article => {
                const articleItem = document.createElement('div');
                articleItem.className = 'article-item';
                
                // 生成标签HTML
                let tagsHTML = '';
                article.tags.forEach(tag => {
                    tagsHTML += `<span class="article-tag">${tag}</span>`;
                });
                
                articleItem.innerHTML = `
                    <div class="article-header">
                        <div class="article-date">${article.date}</div>
                    </div>
                    <div class="article-tags">${tagsHTML}</div>
                    <h3 class="article-title">
                        <a href="doc/${article.id}.html">${article.title}</a>
                    </h3>
                    <p class="article-excerpt">${article.excerpt}</p>
                    <a href="doc/${article.id}.html" class="read-more">
                        阅读全文 <i class="fas fa-arrow-right"></i>
                    </a>
                `;
                
                articlesContainer.appendChild(articleItem);
            });
            
            // 渲染分页控件
            renderPagination(totalPages);
        }
        
        // 渲染分页控件
        function renderPagination(totalPages) {
            paginationContainer.innerHTML = '';
            
            // 上一页按钮
            const prevBtn = document.createElement('a');
            prevBtn.href = '#';
            prevBtn.className = 'page-btn';
            prevBtn.innerHTML = '<i class="fas fa-chevron-left"></i>';
            prevBtn.addEventListener('click', (e) => {
                e.preventDefault();
                if (currentPage > 1) {
                    currentPage--;
                    renderArticles();
                }
            });
            if (currentPage === 1) {
                prevBtn.classList.add('disabled');
            }
            paginationContainer.appendChild(prevBtn);
            
            // 页码按钮
            for (let i = 1; i <= totalPages; i++) {
                const pageBtn = document.createElement('a');
                pageBtn.href = '#';
                pageBtn.className = 'page-btn';
                pageBtn.textContent = i;
                
                if (i === currentPage) {
                    pageBtn.classList.add('active');
                }
                
                pageBtn.addEventListener('click', (e) => {
                    e.preventDefault();
                    currentPage = i;
                    renderArticles();
                });
                
                paginationContainer.appendChild(pageBtn);
            }
            
            // 下一页按钮
            const nextBtn = document.createElement('a');
            nextBtn.href = '#';
            nextBtn.className = 'page-btn';
            nextBtn.innerHTML = '<i class="fas fa-chevron-right"></i>';
            nextBtn.addEventListener('click', (e) => {
                e.preventDefault();
                if (currentPage < totalPages) {
                    currentPage++;
                    renderArticles();
                }
            });
            if (currentPage === totalPages) {
                nextBtn.classList.add('disabled');
            }
            paginationContainer.appendChild(nextBtn);
        }
        
        // 标签筛选功能
        function filterArticles(tag) {
            // 重置为第一页
            currentPage = 1;
            currentTag = tag;
            
            // 更新标签活动状态
            tags.forEach(t => {
                if (t.dataset.tag === tag) {
                    t.classList.add('active');
                } else {
                    t.classList.remove('active');
                }
            });
            
            renderArticles();
        }
        
        // 获取访问者IP地址
        async function fetchVisitorIp() {
            try {
                const response = await fetch('https://api.ipify.org?format=json');
                const data = await response.json();
                visitorIpElement.textContent = data.ip;
            } catch (error) {
                visitorIpElement.textContent = "未获取到IP";
                console.error("获取IP地址失败:", error);
            }
        }
        
        // 更新当前时间
        function updateCurrentTime() {
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            
            currentTimeElement.textContent = `${year}-${month}-${day} ${hours}:${minutes}:${seconds}`;
        }
        
        // 计算网站运行时间
        function calculateUptime() {
            // 网站上线时间：2025年8月1日 10:00 (UTC+8)
            const launchDate = new Date(2025, 7, 1, 10, 0, 0); // 注意：月份从0开始，7代表8月
            const now = new Date();
            
            // 计算时间差（毫秒）
            const diffMs = now - launchDate;
            
            // 转换为天、小时、分钟、秒
            const days = Math.floor(diffMs / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diffMs % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((diffMs % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((diffMs % (1000 * 60)) / 1000);
            
            // 更新显示
            uptimeDaysElement.textContent = days;
            uptimeHoursElement.textContent = hours;
            uptimeMinutesElement.textContent = minutes;
            uptimeSecondsElement.textContent = seconds;
        }
        
        // 绑定标签点击事件
        tags.forEach(tag => {
            tag.addEventListener('click', () => {
                filterArticles(tag.dataset.tag);
            });
        });
        
        // 初始化页面
        document.addEventListener('DOMContentLoaded', () => {
            renderArticles();
            fetchVisitorIp();
            updateCurrentTime();
            calculateUptime();
            
            // 每秒更新时间
            setInterval(updateCurrentTime, 1000);
            
            // 每秒更新运行时间
            setInterval(calculateUptime, 1000);
        });
    </script>
</body>
</html>
